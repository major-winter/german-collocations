name: german_collocations
services:
  db:
    image: postgres:18
    container_name: collocations-db
    environment:
      POSTGRES_DB: collocations
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d collocations']
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: database/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app:${DB_PASSWORD}@db:5432/collocations
    command: ['npm', 'run', 'migrate']

  loader:
    build:
      context: .
      dockerfile: database/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app:${DB_PASSWORD}@db:5432/collocations
    volumes:
      - ./data:/data:ro        # bind-mount your raw Leipzig files here
    command: ['npm', 'run', 'load-data']
    profiles: ['manual']       # keeps it from running on every `up`

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db: 
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app:${DB_PASSWORD}@db:5432/collocations

  frontend:
    build: 
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        VITE_API_URL: ""

  caddy:
    image: caddy:2
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - backend
      - frontend

  extract-examples:
      build:
        context: .
        dockerfile: database/Dockerfile
      depends_on:
        db:
          condition: service_healthy
      environment:
        DATABASE_URL: postgres://app:${DB_PASSWORD}@db:5432/collocations
      volumes:
        - ./data:/data:ro
      command: ['node', 'scripts/extract-examples.ts']
      profiles:
        - manual

  load-pos:
    build:
      context: .
      dockerfile: database/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app:${DB_PASSWORD}@db:5432/collocations
    volumes:
      - ./data:/data:ro        # bind-mount your raw Leipzig files here
    command: ['node', 'scripts/load-pos.ts']
    profiles: ['manual']       # keeps it from running on every `up`

  load-lemmas:
    build:
      context: .
      dockerfile: database/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app:${DB_PASSWORD}@db:5432/collocations
    volumes:
      - ./data:/data:ro        # bind-mount your raw Leipzig files here
    command: ['node', 'scripts/load-lemmas.ts']
    profiles: ['manual']       # keeps it from running on every `up`

  load-lemma-collocations:
    build:
      context: .
      dockerfile: database/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app:${DB_PASSWORD}@db:5432/collocations
    volumes:
      - ./data:/data:ro        # bind-mount your raw Leipzig files here
    command: ['node', 'scripts/load-lemma-collocations.ts']
    profiles: ['manual']       # keeps it from running on every `up`

volumes:
  postgres_data:
  caddy_data:
