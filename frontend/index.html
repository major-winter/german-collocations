<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Decision #59: stop iOS Safari zooming in when the search box is
      // tapped. iOS keeps pinch-zoom despite maximum-scale; Android would
      // not, so the tag is only changed on iPhone/iPad (iPadOS reports a Mac).
      if (/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
        document.querySelector('meta[name="viewport"]').content = 'width=device-width, initial-scale=1.0, maximum-scale=1';
      }
    </script>
    <script>
      // Follow the system's light/dark setting; index.css keys the dark
      // colours off a .dark class on <html>.
      (function () {
        var darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
        function applyTheme() {
          document.documentElement.classList.toggle('dark', darkQuery.matches);
        }
        applyTheme();
        darkQuery.addEventListener('change', applyTheme);
      })();
    </script>
    <title>Wortnetz</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
